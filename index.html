<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMAT Sako SIT Lampung - Login Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-emerald-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-md w-full border border-emerald-100">
    <!-- Header Logo -->
    <div class="bg-gradient-to-r from-emerald-800 to-emerald-700 p-6 text-center text-white relative">
      <div class="w-16 h-16 bg-amber-400 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
        <i data-lucide="shield" class="w-8 h-8 text-emerald-900"></i>
      </div>
      <h1 class="text-xl font-bold tracking-wide">SIMAT SAKO SIT</h1>
      <p class="text-xs text-emerald-100 font-medium">Provinsi Lampung</p>
    </div>

    <!-- Form Login -->
    <div class="p-6">
      <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Role / Peran</label>
          <select id="userRole" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="super_admin">Super Admin (Sako Daerah)</option>
            <option value="admin_cabang">Admin Cabang (Kab/Kota)</option>
            <option value="pembina">Pembina / Pelatih Gudep</option>
            <option value="anggota">Anggota / Peserta Didik</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">NTA / Email Sako</label>
          <input type="text" id="email" required placeholder="18.01.001.24.0001" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kata Sandi</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg shadow-md transition flex items-center justify-center gap-2">
          <span>Masuk ke Sistem</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t text-center text-xs text-gray-500">
        Satuan Komunitas Pramuka Sekolah Islam Terpadu<br>Wilayah Lampung © 2026
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('userRole').value;
      localStorage.setItem('simat_user_role', role);
      window.location.href = 'admin.html';
    }
  </script>
</body>
</html>
